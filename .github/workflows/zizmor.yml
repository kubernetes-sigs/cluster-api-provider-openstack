---
# Static analysis for GitHub Actions workflows
# https://docs.zizmor.sh/
name: zizmor

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    - 'release-*'

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # Upload SARIF to Security tab on push to main
    - name: Run zizmor (SARIF)
      if: github.event_name == 'push'
      uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
    # Block PRs with findings
    - name: Run zizmor (PR check)
      if: github.event_name == 'pull_request'
      uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
      with:
        advanced-security: false
